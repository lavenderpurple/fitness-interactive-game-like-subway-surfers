<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Fitness Runner - Dev Dashboard</title>
    <style>
        body { 
            margin: 0; padding: 20px; background-color: #1a1a1a; 
            color: white; font-family: sans-serif; display: flex; 
            flex-direction: column; align-items: center; 
        }
        h2 { margin-top: 0; color: #00ffcc; }
        #dev-workspace {
            display: flex; flex-direction: row; gap: 20px; align-items: flex-start; margin-top: 10px;
        }
        #game-container { 
            width: 600px; height: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); border: 2px solid #333;
        }
        .video-container { 
            position: relative; border: 2px solid #555; background-color: #000;
            width: 480px; height: 360px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        #webcam { display: none; } 
        #output_canvas { transform: scaleX(-1); width: 100%; height: 100%; }
        #ui-layer {
            position: absolute; top: 80px; left: 40px; pointer-events: none;
            font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000;
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h2>3D Fitness Engine: Jump & Crouch Detection</h2>
    
    <div id="dev-workspace">
        <div id="game-wrapper" style="position:relative;">
            <div id="game-container"></div>
            <div id="ui-layer">
                <div id="status-text" style="color: #ff3333;">IDLE - JOG TO MOVE</div>
                <div id="action-text" style="color: #ffff00; font-size: 32px; margin-top: 10px;"></div>
            </div>
        </div>

        <div class="video-container">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output_canvas" width="480" height="360"></canvas>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
